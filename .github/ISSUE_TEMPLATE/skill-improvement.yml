name: Skill improvement
description: Record evidence from real use before changing a skill or plugin workflow.
title: "[skill] "
labels:
  - skill-improvement
body:
  - type: input
    id: skill
    attributes:
      label: Skill or plugin
      placeholder: weekly-review
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence from real use
      description: Describe the correction, hesitation, repeated friction, or useful behavior without including private source material.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Smallest proposed change
      description: Explain what should behave differently. A precise problem is enough when the solution is not clear yet.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Decision owner
      description: Name the person whose approval is needed for a shared or sensitive change.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This issue contains no credentials, private messages, personal notes, or other sensitive source material.
          required: true
